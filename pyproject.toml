[project]
name = "iot-mcp-bridge"
version = "0.6.0"
description = "MCP server bridging homelab IoT data (KNX, EMS, WARP, SolarEdge) to Claude.ai via TimescaleDB"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.13"
authors = [
    { name = "Alexander Zimmermann" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "fastmcp>=3.3.1",
    "uvicorn[standard]>=0.48.0",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "structlog>=25.5.0",
    "pyjwt[crypto]>=2.13.0",
    "httpx>=0.28.1",
    "cachetools>=7.1.4",
    "prometheus-client>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "testcontainers[postgres]>=4.14.2",
    "respx>=0.23.1",
    "ruff>=0.15.15",
    "mypy>=2.1.0",
    "types-PyYAML>=6.0.12.20260518",
    "pre-commit>=4.6.0",
]
# Heavy ML/data deps used only by the batch-job CLI subcommands. Kept in a
# separate extra so local dev (`uv sync`) can skip ~400 MB of scientific
# libraries; the production Dockerfile installs them via `.[jobs]`.
jobs = [
    "scikit-learn>=1.8.0",
    "statsforecast>=2.0.3",
    "joblib>=1.5.3",
    "boto3>=1.43.18",
    "pandas>=3.0.3",
    "numpy>=2.4.6",
    "nats-py>=2.14.0",
]

[project.scripts]
iot-mcp-bridge = "iot_mcp_bridge.__main__:main"
iot-mcp-bridge-jobs = "iot_mcp_bridge.jobs.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iot_mcp_bridge"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001"]  # pytest fixtures injected for setup side-effects

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# psycopg's dict_row factory returns dicts at runtime but the stubs cannot
# express that, so row["col"] reads are flagged. We rely on tests instead.
module = [
    "iot_mcp_bridge.tools.schema",
    "iot_mcp_bridge.tools.timeseries",
    "iot_mcp_bridge.tools.domain",
    "iot_mcp_bridge.tools.insights",
    "iot_mcp_bridge.cli.import_knx_catalog",
    "iot_mcp_bridge.jobs.db_write",
    "iot_mcp_bridge.jobs.detect_univariate",
]
disable_error_code = ["call-overload", "attr-defined", "index", "dict-item", "assignment", "arg-type"]

[[tool.mypy.overrides]]
module = ["fastmcp", "fastmcp.*", "testcontainers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ML / NATS / S3 deps in the jobs CLI don't publish PEP 561 type stubs.
module = ["nats", "joblib", "boto3", "botocore.client"]
ignore_missing_imports = true

# Pylance/Pyright counterparts to the mypy overrides above — quiet the
# psycopg `dict_row` and stub-gap warnings the CI gate (mypy) already
# disables.
[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportAttributeAccessIssue = "none"
reportUnnecessaryIsInstance = "none"
reportUnnecessaryComparison = "none"
# psycopg's stubs declare `cursor.execute(query: QueryNoTemplate, ...)` where
# QueryNoTemplate excludes plain `str`; in practice we pass dynamically-built
# SQL strings (registry-driven detector, dynamic WHERE clauses). Same gap mypy
# already disables via tool.mypy.overrides for these modules.
reportArgumentType = "none"
reportCallIssue = "none"
reportReturnType = "none"

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
